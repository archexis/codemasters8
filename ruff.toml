# Ruff для backend/ — КРУПНЫЙ недостаток #2 (backend-lint в CI).
# Python 3.12 (см. docs/DEVELOPMENT.md и .github/workflows/ci.yml).
target-version = "py312"
line-length = 100

[lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  # E501: длинные SQL/строки в FastAPI — норма, контроль через ruff format.
  "E501",
  # B008: Query()/Header()/Depends() в сигнатурах — каноничный FastAPI,
  # а не изменяемый дефолт; флаг ложноположителен для этого стека.
  "B008",
  # UP035: datetime.UTC требует 3.11+, локальный рантайм 3.10 —
  # оставляем timezone.utc ради совместимости (CI на 3.12 тоже ок).
  "UP035",
  # UP017: тот же alias datetime.UTC — та же причина 3.10.
  "UP017",
]
