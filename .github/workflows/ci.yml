name: Verify application

# Отмена устаревших прогонов при новом push в ту же ветку/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on: [push, pull_request]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      # Coverage как отчёт: без порогов, гейт добавим после сбора базы.
      - run: npm run coverage
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:cloud
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-results, path: test-results/ }
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r backend/requirements.lock.txt
      - run: python -m pytest backend/tests -q
      # Coverage как отчёт: без fail-under, гейт добавим после сбора базы.
      - run: pip install pytest-cov
      - run: python -m pytest backend/tests -q --cov=backend/app --cov-report=term-missing --cov-report=lcov
  backend-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install ruff
      # Строго только product-код: backend/tests пишут компактно (; one-liners),
      # их стиль не ровняем. E501/B008 заигнорены в ruff.toml с причинами.
      - run: ruff check backend/app
      # ruff format НЕ enforced: нормализация кавычек/CRLF тронула бы 2000+ строк
      # и убила читаемость отката. Формат новых файлов — по ruff format вручную.
      # mypy пока информативный: типизация backend/ неполная, падать CI не должен.
      - run: pip install mypy
      - run: mypy backend/app --ignore-missing-imports
        continue-on-error: true
  edge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: deno check supabase/functions/analyze/index.ts
      - run: deno test --allow-env supabase/functions/analyze/index.test.ts
